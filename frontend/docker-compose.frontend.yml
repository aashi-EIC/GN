services:
  frontend:
    image: conversational-bi-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?Set VITE_ENTRA_CLIENT_ID in .env}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:?Set VITE_ENTRA_TENANT_ID in .env}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:?Set VITE_ENTRA_API_SCOPE in .env}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env}
    ports:
      - "5173:80"
    restart: unless-stopped
